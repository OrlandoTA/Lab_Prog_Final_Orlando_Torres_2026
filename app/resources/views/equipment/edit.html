    <link rel="stylesheet" href="../../../../public/app/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--JS-->

    <script src="../../../../public/app/js/orders/edit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Editar equipo</title>

<body>
    <nav class="navbar navbar-expand-lg navbar-fixium">
        <div class="container-fluid">

            <!-- Logo a la izquierda -->
            <a class="navbar-brand" href="#">FIXIUM</a>

            <!-- Botón responsive -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links a la derecha -->
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" aria-current="page"
                            href="http://localhost/Lab_Prog_Final_Orlando_Torres_2026/app/resources/views/home/index.html">
                            <i class="bi bi-house"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="http://localhost/Lab_Prog_Final_Orlando_Torres_2026/app/resources/views/orders">
                            <i class="bi bi-clipboard-check"></i>
                            Órdenes
                        </a>
                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="http://localhost/Lab_Prog_Final_Orlando_Torres_2026/app/resources/views/equipment/index.html?"><i
                                class="bi bi-laptop"></i>Equipos</a>
                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="http://localhost/Lab_Prog_Final_Orlando_Torres_2026/app/resources/views/customer/index.html?"><i

                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">

                            Perfil
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#">Cuenta</a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">Cerrar sesión</a>
                            </li>
                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-between">
            <a href="http://localhost/Lab_Prog_Final_Orlando_Torres_2026/app/resources/views/equipment/index.html?"
                class="btn btn-secondary" role="button" id="btnVolver">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-arrow-left" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
                </svg>
                Volver
            </a>
            <h2 class="titulo-vista mb-4">Editar equipo</h2>
            <button type="button" class="btn btn-primary" id="btnEditar">
                <i class="bi bi-pencil-square"></i>
                Editar
            </button>
        </div>
        <form action="" class="formCrear">


            <div class="row g-3">

                <div class="col-12">
                    <label for="equipo" class="form-label">Tipo de equipo</label>
                    <input type="text" class="form-control" id="equipo" rows="4" placeholder="Ej.: Computadora">

                </div>

            </div>


            <div class="d-flex justify-content-end gap-2 mt-4 mb-4">
                <a href="http://localhost/Lab_Prog_Final_Orlando_Torres_2026/app/resources/views/equipment/index.html"
                    class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </a>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i>
                    Guardar
                </button>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 mb-4" id="btnDescartarCambios">
                <button type="button" class="btn btn-outline-secondary btn-lg" class="btnAnularCambios">
                    <i class="bi bi-x-lg"></i>
                    Descartar cambios
                </button>

                <button type="submit" class="btn btn-success" id="btnGuardar">
                    <i class="bi bi-check-lg"></i>
                    Guardar
                </button>
            </div>
        </form>



    </div>
